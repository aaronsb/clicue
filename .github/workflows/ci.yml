# CI mirrors `make check` and `make e2e` — the Makefile is the canonical
# interface; these jobs only provide the machine that runs it on every PR.
# The e2e job is separate so a pty flake never muddies the check signal.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh (the shim unit tests exec it)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make check

  e2e:
    name: sandboxed pty scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Probe timing (diagnosing the 10s doctor timeout on runners)
        run: |
          time zsh -ic 'print interactive-ok' </dev/null || true
          time zsh -c 'print plain-ok' </dev/null || true
          ls -la /etc/zsh/ || true
          echo "TERM=$TERM LANG=$LANG SHELL=$SHELL"
      - run: make e2e

  adr-lint:
    name: adr + doc structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docs/scripts/adr lint --check
