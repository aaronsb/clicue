name: Bug report
description: Something clicue does wrong — cards, keys, daemon, or tools
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        What you typed, what you expected on the card, what you got.
        Keystroke sequences help enormously ("ffmpeg -" then Tab twice).
      placeholder: "'ffmpeg -' + Tab shows the raw compsys listing instead of the card"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: clicue doctor output
      description: >
        Run `clicue doctor` and paste the output — it names fighters,
        stolen key bindings, and degradations that explain most misbehavior.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: terminal, zsh version, OS
      placeholder: konsole 24.12 · zsh 5.9 · Arch
  - type: textarea
    id: config
    attributes:
      label: Anything unusual in your zsh config?
      description: >
        Plugin managers, menu select styles, custom bindkey lines after
        clicue loads — the categories that have bitten before.
