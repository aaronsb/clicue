[package]
name = "clicue"
description = "Live, contextual command guidance for zsh — a daemon behind a generated shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[lib]
name = "clicue"
path = "src/lib.rs"

[[bin]]
name = "clicue"
path = "src/main.rs"
