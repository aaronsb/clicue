# clicue theme "mono" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "unicode-rounded"

[palette]
border = "fg=default"
accent = "bold"
text = "fg=default"
gloss = "fg=#808080"
hint = "fg=#808080"
ghost = "fg=#808080"
selected = "fg=white,bg=#444444"
match = "bold"
