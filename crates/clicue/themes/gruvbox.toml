# clicue theme "gruvbox" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "unicode-rounded"

[palette]
border = "fg=#d79921"
accent = "fg=#b8bb26"
text = "fg=#ebdbb2"
gloss = "fg=#928374"
hint = "fg=#928374"
ghost = "fg=#928374"
selected = "fg=#ebdbb2,bg=#504945"
match = "fg=#fabd2f,bold"
