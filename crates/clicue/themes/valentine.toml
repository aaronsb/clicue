# clicue theme "valentine" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "unicode-rounded"

[palette]
border = "fg=#f472b6"
accent = "fg=#fb7185"
text = "fg=#ffe4e6"
gloss = "fg=#c48b9f"
hint = "fg=#a06b80"
ghost = "fg=#a06b80"
selected = "fg=#fff1f2,bg=#9f1239"
match = "fg=#fda4af,bold"
panel = "bg=#3a1b29"
border-gradient = ["#9f1239", "#fda4af", "#fecdd3", "#fb7185", "#be185d"]
