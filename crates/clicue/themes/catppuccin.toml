# clicue theme "catppuccin" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "unicode-rounded"

[palette]
border = "fg=#585b70"
accent = "fg=#89b4fa"
text = "fg=#cdd6f4"
gloss = "fg=#6c7086"
hint = "fg=#6c7086"
ghost = "fg=#6c7086"
selected = "fg=#cdd6f4,bg=#313244"
match = "fg=#f5c2e7,bold"
panel = "bg=#1e1e2e"
