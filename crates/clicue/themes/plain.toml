# clicue theme "plain" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "ascii"

[palette]
border = "fg=blue"
accent = "fg=cyan"
text = "fg=default"
gloss = "fg=default"
hint = "fg=default"
ghost = "fg=default"
selected = "fg=white,bg=blue"
match = "fg=cyan,bold"
