# clicue theme "chrome" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "unicode-rounded"

[palette]
border = "fg=#9ca3af"
accent = "fg=#ffffff,bold"
text = "fg=#e5e7eb"
gloss = "fg=#9ca3af"
hint = "fg=#6b7280"
ghost = "fg=#6b7280"
selected = "fg=#f9fafb,bg=#374151"
match = "fg=#ffffff,bold"
border-gradient = ["#4b5563", "#d1d5db", "#f9fafb", "#9ca3af", "#374151"]
