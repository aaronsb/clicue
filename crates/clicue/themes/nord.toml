# clicue theme "nord" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.

glyph-set = "unicode-rounded"

[palette]
border = "fg=#81a1c1"
accent = "fg=#88c0d0"
text = "fg=#eceff4"
gloss = "fg=#616e88"
hint = "fg=#616e88"
ghost = "fg=#616e88"
selected = "fg=#eceff4,bg=#434c5e"
match = "fg=#a3be8c,bold"
