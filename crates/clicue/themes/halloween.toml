# clicue theme "halloween" — regenerated from the built-in when this file
# is missing, so DELETING it restores the default. Edits apply live.
# Partial files are legal: absent keys fall back to the base theme.
# Actually spooky this time: jack-o-lanterns and bats ramp down into a
# cobweb-dashed rule. Needs an emoji-capable font (declared below) —
# `clicue theme lint halloween` will tell you what any edit needs.

glyph-set = "unicode-rounded"
requires = "emoji"

[glyphs]
tl = "🎃▓▒░"
tr = "░▒▓🎃"
bl = "🦇▓▒░"
br = "░▒▓🦇"
jl = "👻▒░"
jr = "░▒👻"
h = "┄"

[palette]
border = "fg=#ff7518"
accent = "fg=#a78bfa"
text = "fg=#f4ecd8"
gloss = "fg=#8b7a9e"
hint = "fg=#8b7a9e"
ghost = "fg=#6b5e85"
selected = "fg=#140a1e,bg=#ff7518"
match = "fg=#84cc16,bold"
panel = "bg=#140a1e"
